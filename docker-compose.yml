name: aurora-api-gateway

services:
  controller:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.controller
    image: aurora-api-gateway-controller:latest
    container_name: aurora-controller
    ports:
      - "8080:8080"
      - "9090:9090"
      - "5140:5140/udp"
    environment:
      - AURORA_GRPC_ADDR=0.0.0.0:9090
      - AURORA_RATE_LIMIT_UDP=0.0.0.0:5140
      - AURORA_JWT_SECRET=aurora-api-gateway-jwt-secret-docker-compose-dev-key
    volumes:
      - controller-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s

  node:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.node
    image: aurora-api-gateway-node-01:latest
    container_name: aurora-node
    environment:
      - CONTROLLER_URL=http://controller:8080
      - NODE_ID=node-01
      - AUTH_TOKEN=71b268cadc82c2ecfff176c7dfd5c4ac77a0e6a3cd0ae3a7d87b1b9bb686b994
    ports:
      - "80:80"
      - "8090:80"
      - "9145:9145"
    volumes:
      - node-policy:/var/lib/aurora-policy
      - node-routing:/var/lib/aurora-routing
      - ./deploy/docker/entrypoint-node.sh:/entrypoint.sh:ro
      - ./deploy/docker/nginx-node.conf.template:/etc/nginx/nginx-node.conf.template:ro
    depends_on:
      controller:
        condition: service_healthy
    restart: unless-stopped

volumes:
  controller-data:
  node-policy:
  node-routing:
