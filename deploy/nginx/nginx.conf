# Local foundation runner. Start with the repository root as nginx -p prefix.
# Management is separate from the local demo data plane on port 8090.
load_module build/modules/ngx_http_aurora_waf_module.so;
worker_processes 1;
pid build/runtime/nginx.pid;
error_log build/runtime/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/x-icon ico;
        font/woff2 woff2;
    }
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 1m;
    log_format local '$time_iso8601 $request_method $status $body_bytes_sent';
    access_log build/runtime/nginx-access.log local;
    client_body_temp_path build/runtime/client_temp;
    proxy_temp_path build/runtime/proxy_temp;
    fastcgi_temp_path build/runtime/fastcgi_temp;
    uwsgi_temp_path build/runtime/uwsgi_temp;
    scgi_temp_path build/runtime/scgi_temp;

    server {
        listen 127.0.0.1:8090;
        server_name localhost;
        aurora_waf on;
        aurora_waf_policy build/runtime/active-policy.json;
        aurora_waf_mode enforce;
        # Local-only observability; this observes one responding worker.
        add_header X-Aurora-Generation $aurora_waf_generation always;
        root deploy/demo;
        default_type text/plain;
        location / { try_files $uri =404; }
    }
}
