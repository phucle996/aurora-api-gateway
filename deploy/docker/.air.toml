root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/aurora-controller"
  cmd = "cd control-plane && go build -buildvcs=false -o ../tmp/aurora-controller ./cmd"
  delay = 1000
  exclude_dir = ["target", "build", "ui", ".git", "deploy"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["control-plane"]
  include_ext = ["go", "html", "js", "css", "png"]
  include_file = []
  kill_delay = "500ms"
  log = "build-errors.log"
  poll = true
  poll_interval = 500
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
