worker_processes 2;
worker_rlimit_nofile 65535;
events {
    worker_connections 8192;
}

http {
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65s;
    keepalive_requests 100000;

    upstream waf_cluster {
        # Cân bằng tải phân tán least_conn tới 3 node WAF
        least_conn;
        keepalive 256;
        # Keep peers eligible during graceful reload; retry connection failures per request.
        server node-01:80 max_fails=0;
        server node-02:80 max_fails=0;
        server node-03:80 max_fails=0;
    }

    # Mutations cannot safely replay after a stale keepalive socket resets.
    # Give them a fresh origin connection; retain pooling for read requests.
    upstream waf_mutations {
        least_conn;
        server node-01:80 max_fails=0;
        server node-02:80 max_fails=0;
        server node-03:80 max_fails=0;
    }
    map $request_method $aurora_lb_pool {
        default waf_mutations;
        GET waf_cluster;
        HEAD waf_cluster;
        OPTIONS waf_cluster;
    }
    map $request_method $aurora_lb_connection {
        default close;
        GET '';
        HEAD '';
        OPTIONS '';
    }

    server {
        listen 80;

        # Chặn truy cập nội bộ Aurora từ bên ngoài
        location ^~ /_aurora/ {
            return 403 "Forbidden\n";
        }

        location / {
            proxy_pass http://$aurora_lb_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection $aurora_lb_connection;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
        }

        # Trạng thái HA Cluster
        location /lb-status {
            default_type text/plain;
            return 200 "HA Load Balancer Active: node-01, node-02, node-03\n";
        }
    }
}
