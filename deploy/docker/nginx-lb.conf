events {
    worker_connections 8192;
}

http {
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65s;

    upstream waf_cluster {
        # Cân bằng tải phân tán least_conn tới 3 node WAF
        least_conn;
        server node-01:80 max_fails=2 fail_timeout=3s;
        server node-02:80 max_fails=2 fail_timeout=3s;
        server node-03:80 max_fails=2 fail_timeout=3s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://waf_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
        }

        # Trạng thái HA Cluster
        location /lb-status {
            default_type text/plain;
            return 200 "HA Load Balancer Active: node-01, node-02, node-03\n";
        }
    }
}
