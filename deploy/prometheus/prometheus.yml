global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'aurora-waf-nodes'
    honor_labels: true
    metrics_path: '/metrics'
    static_configs:
      - targets: ['node:80']
