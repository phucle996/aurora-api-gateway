[package]
name = "aurora-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aurora-engine = { path = "../engine" }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }
libc = "0.2"
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
regex = "1"
redis = { version = "1.7.0", features = ["tls-rustls"] }
base64 = "0.22"
memchr = "2"
aho-corasick = "1.1"
rustc-hash = "2.1"
parking_lot = "0.12"
ring = "0.17"
ipnet = "2"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
zstd = { version = "0.13", default-features = false }
brotli = { version = "7.0", default-features = false, features = ["std"] }
