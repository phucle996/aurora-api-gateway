[package]
name = "aurora-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "aurora-compile"
path = "src/bin/compile.rs"

[[bench]]
name = "rate_limit_local"
harness = false

[[bench]]
name = "jwt_evaluate"
harness = false

[[bench]]
name = "conn_limit_local"
harness = false

[[bench]]
name = "request_size_limit"
harness = false

[[bench]]
name = "traffic_shaper"
harness = false

[dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
regex = "1"
redis = { version = "1.7.0", features = ["tls-rustls"] }
