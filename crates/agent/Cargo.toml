[package]
name = "aurora-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "aurora_agent"
path = "src/lib.rs"

[[bin]]
name = "aurora-agent"
path = "src/main.rs"

[[bench]]
name = "l4_materialize"
harness = false

[[bench]]
name = "routing_materialize"
harness = false

[[bench]]
name = "log_processing"
harness = false

[[bench]]
name = "opentelemetry_tracing"
harness = false

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
hex = "0.4"
ipnet = "2"
regex = "1"
anyhow = "1.0"
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
tokio-util = "0.7"
libc = "0.2"
aurora-engine = { path = "../engine" }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "metrics", "logs", "trace", "with-serde"] }

[build-dependencies]
tonic-prost-build = "0.14"
