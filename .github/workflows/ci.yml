name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust (Format, Clippy, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - name: Install Protobuf Compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace

  ui-checks:
    name: UI (TypeScript & Vite Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Typecheck and build UI
        working-directory: ui
        run: npm run build

  control-plane-checks:
    name: Control Plane (Go Tests & Vet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build compiler binary
        run: cargo build --locked -p aurora-engine --bin aurora-compile --release

      - name: Ensure embedded UI assets exist
        run: |
          mkdir -p control-plane/internal/console/dist
          if [ ! -f control-plane/internal/console/dist/index.html ]; then
            echo '<!doctype html><html><head><title>Aurora WAF</title></head><body>Aurora WAF</body></html>' > control-plane/internal/console/dist/index.html
          fi

      - name: Run Go vet
        working-directory: control-plane
        run: go vet ./...

      - name: Run Go unit and integration tests
        working-directory: control-plane
        env:
          AURORA_TEST_COMPILER: ${{ github.workspace }}/target/release/aurora-compile
        run: go test -count=1 ./...

  nginx-module-integration:
    name: NGINX Dynamic Module Integration
    needs: [rust-checks, control-plane-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install NGINX module build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpcre2-dev

      - name: Build compiler and module
        run: |
          make compiler
          make module

      - name: Run C FFI smoke test
        run: |
          cargo build -p aurora-ffi
          gcc -pipe -O -W -Wall -Wpointer-arith -Wno-unused-parameter -g -DNGX_HAVE_CONFIG_H \
            -Iadapters/nginx/include \
            -Ibuild/nginx-source/nginx-1.30.4/src/core \
            -Ibuild/nginx-source/nginx-1.30.4/src/event \
            -Ibuild/nginx-source/nginx-1.30.4/src/event/modules \
            -Ibuild/nginx-source/nginx-1.30.4/src/os/unix \
            -Ibuild/nginx-source/nginx-1.30.4/src/http \
            -Ibuild/nginx-source/nginx-1.30.4/src/http/modules \
            -Ibuild/nginx-source/nginx-1.30.4/objs \
            -Ibuild/nginx-deps/root/usr/include \
            adapters/nginx/tests/ffi_smoke.c target/debug/libaurora_ffi.a -lpthread -ldl -lm -o /tmp/ffi_smoke
          /tmp/ffi_smoke

      - name: Build matching NGINX test host
        run: make -C build/nginx-source/nginx-1.30.4 -j$(nproc)

      - name: Verify NGINX dynamic module loading
        run: |
          mkdir -p /tmp/nginx-test/logs
          cat << 'EOF' > /tmp/nginx-test/nginx.conf
          pid /tmp/nginx-test/nginx.pid;
          error_log /tmp/nginx-test/logs/error.log;
          load_module ${{ github.workspace }}/build/modules/ngx_http_gateway_module.so;
          events { worker_connections 64; }
          http {
              gateway on;
              server {
                  listen 127.0.0.1:19876;
              }
          }
          EOF
          ./build/nginx-source/nginx-1.30.4/objs/nginx -t -p /tmp/nginx-test -c /tmp/nginx-test/nginx.conf
