name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build all artifacts once on Linux amd64 and upload as job outputs.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcre2-dev protobuf-compiler

      # ── Rust binaries ──────────────────────────────────────────────────────
      - name: Build aurora-compile (Rust compiler binary)
        run: cargo build --locked --release -p aurora-engine --bin aurora-compile

      - name: Build aurora-agent (Rust node agent)
        run: cargo build --locked --release -p aurora-agent

      # ── NGINX 1.30.4 runtime and Gateway dynamic module ────────────────────
      - name: Build NGINX 1.30.4 Gateway module
        run: bash scripts/build-nginx-module.sh 1.30.4

      - name: Build NGINX 1.30.4 runtime
        run: |
          cd build/nginx-source/nginx-1.30.4
          make -j$(nproc)
          make DESTDIR="$GITHUB_WORKSPACE/build/nginx-runtime" install
          mkdir -p "$GITHUB_WORKSPACE/build/nginx-runtime/usr/sbin"
          cp -f "$GITHUB_WORKSPACE/build/nginx-runtime/usr/local/nginx/sbin/nginx" "$GITHUB_WORKSPACE/build/nginx-runtime/usr/sbin/nginx"

      # ── UI ─────────────────────────────────────────────────────────────────
      - name: Build UI assets
        working-directory: ui
        run: |
          npm ci
          npm run build

      # ── Control Plane binary ───────────────────────────────────────────────
      - name: Build aurora-controller (Go binary)
        working-directory: control-plane
        env:
          CGO_ENABLED: "0"
        run: |
          BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S')
          go build -buildvcs=false -trimpath \
            -ldflags="-s -w -X 'main.version=${{ github.ref_name }}' -X 'main.buildTime=${BUILD_TIME}' -X 'aurora-waf.local/control-plane/internal/config.DefaultVersion=${{ github.ref_name }}' -X 'aurora-waf.local/control-plane/internal/config.DefaultBuildTime=${BUILD_TIME}'" \
            -o ../build/aurora-controller ./cmd

      # ── Trivy source code scan ────────────────────────────────────────────
      - name: Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-source.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Trivy config and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-misconfig.sarif
          scanners: misconfig,secret
          exit-code: "0"

      - name: Upload Trivy source SARIF to GitHub Security
        if: always() && hashFiles('trivy-source.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-source.sarif
          category: trivy-source

      - name: Upload Trivy misconfig SARIF to GitHub Security
        if: always() && hashFiles('trivy-misconfig.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-misconfig.sarif
          category: trivy-misconfig

      # ── Package systemd tarball ────────────────────────────────────────────
      - name: Package Linux systemd release tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIST="aurora-api-gateway-${VERSION}-linux-amd64"
          mkdir -p "dist/${DIST}/bin" "dist/${DIST}/modules" "dist/${DIST}/deploy" "dist/${DIST}/nginx-runtime"

          # Binaries
          cp build/aurora-controller             "dist/${DIST}/bin/"
          cp target/release/aurora-compile       "dist/${DIST}/bin/"
          cp target/release/aurora-agent         "dist/${DIST}/bin/"

          # NGINX 1.30.4 runtime and Gateway dynamic module
          cp -rf build/nginx-runtime/*           "dist/${DIST}/nginx-runtime/"
          cp -f build/modules/ngx_http_gateway_module*.so "dist/${DIST}/modules/"
          cp scripts/nginx-versions.txt          "dist/${DIST}/modules/supported-versions.txt"

          # Node deploy templates
          cp deploy/docker/nginx-node.conf.template "dist/${DIST}/deploy/"

          # Self-contained installer (downloads release package or uses local bundle, generates systemd units)
          install -m 755 install.sh "dist/${DIST}/install.sh"
          cp deploy/systemd/RELEASE_README.md "dist/${DIST}/README.md"

          tar -czf "dist/aurora-api-gateway-${VERSION}-linux-amd64.tar.gz" -C dist "${DIST}"
          (cd dist && sha256sum "aurora-api-gateway-${VERSION}-linux-amd64.tar.gz" > "aurora-api-gateway-${VERSION}-linux-amd64.tar.gz.sha256")

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/aurora-api-gateway-*.tar.gz*
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Push Docker images to GHCR (Control Plane & Gateway).
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Images → GHCR (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            image_names: |
              ghcr.io/${{ github.repository_owner }}/control-plane
              ghcr.io/${{ github.repository_owner }}/aurora-control-plane
            dockerfile: deploy/docker/Dockerfile.controller
          - name: gateway
            image_names: |
              ghcr.io/${{ github.repository_owner }}/gateway
              ghcr.io/${{ github.repository_owner }}/aurora-gateway
            dockerfile: deploy/docker/Dockerfile.node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image_names }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy vulnerability scan ─────────────────────────────────────────
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.name)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release with the Linux tarball.
  # ─────────────────────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/aurora-api-gateway-*.tar.gz
            dist/aurora-api-gateway-*.tar.gz.sha256
          body: |
            ## Docker Images (GHCR)

            ```bash
            # Control Plane
            docker pull ghcr.io/${{ github.repository_owner }}/control-plane:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository_owner }}/aurora-control-plane:${{ github.ref_name }}

            # Gateway (NGINX + Dataplane Agent)
            docker pull ghcr.io/${{ github.repository_owner }}/gateway:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository_owner }}/aurora-gateway:${{ github.ref_name }}
            ```

            ## Linux Systemd (Bare-metal)

            ```bash
            # One-line quick installer (installs latest release)
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash

            # Or install this specific release
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash -s -- -v ${{ github.ref_name }}

            # Or install from downloaded tarball
            tar xzf aurora-api-gateway-*-linux-amd64.tar.gz
            cd aurora-api-gateway-*-linux-amd64
            sudo ./install.sh
            ```

            See the included `README.md` in the tarball for full instructions.
