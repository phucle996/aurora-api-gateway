name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/aurora-waf

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build all artifacts once on Linux amd64 and upload as job outputs.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcre2-dev

      # ── Rust binaries ──────────────────────────────────────────────────────
      - name: Build aurora-compile (Rust compiler binary)
        run: cargo build --locked --release -p aurora-engine --bin aurora-compile

      # ── NGINX dynamic modules (all supported versions) ─────────────────────
      - name: Build NGINX WAF modules for all supported versions
        run: bash scripts/build-nginx-module.sh

      - name: Build NGINX 1.30.4 runtime for Docker bundling
        run: |
          cd build/nginx-source/nginx-1.30.4
          make -j$(nproc)
          make DESTDIR="$GITHUB_WORKSPACE/build/nginx-runtime" install
          mkdir -p "$GITHUB_WORKSPACE/build/nginx-runtime/usr/sbin"
          cp -f "$GITHUB_WORKSPACE/build/nginx-runtime/usr/local/nginx/sbin/nginx" "$GITHUB_WORKSPACE/build/nginx-runtime/usr/sbin/nginx"

      # ── UI ─────────────────────────────────────────────────────────────────
      - name: Build UI assets
        working-directory: ui
        run: |
          npm ci
          npm run build

      # ── Control Plane binary ───────────────────────────────────────────────
      - name: Build aurora-controller (Go binary)
        working-directory: control-plane
        env:
          CGO_ENABLED: "0"
        run: go build -buildvcs=false -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../build/aurora-controller ./cmd

      # ── Trivy source code scan ────────────────────────────────────────────
      - name: Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-source.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Trivy config and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-misconfig.sarif
          scanners: misconfig,secret
          exit-code: "0"

      - name: Upload Trivy source SARIF to GitHub Security
        if: always() && hashFiles('trivy-source.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-source.sarif
          category: trivy-source

      - name: Upload Trivy misconfig SARIF to GitHub Security
        if: always() && hashFiles('trivy-misconfig.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-misconfig.sarif
          category: trivy-misconfig

      # ── Package systemd tarball ────────────────────────────────────────────
      - name: Package Linux systemd release tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIST="aurora-waf-${VERSION}-linux-amd64"
          mkdir -p "dist/${DIST}/bin" "dist/${DIST}/modules" "dist/${DIST}/deploy"

          # Binaries
          cp build/aurora-controller             "dist/${DIST}/bin/"
          cp target/release/aurora-compile       "dist/${DIST}/bin/"

          # NGINX dynamic modules (one per supported version)
          cp build/modules/ngx_http_aurora_waf_module-*.so "dist/${DIST}/modules/"
          cp scripts/nginx-versions.txt "dist/${DIST}/modules/supported-versions.txt"

          # Node deploy scripts (for bare-metal agent setup)
          cp deploy/docker/domain-routing-agent.sh  "dist/${DIST}/deploy/"
          cp deploy/docker/node-dependencies.sh     "dist/${DIST}/deploy/"
          cp deploy/docker/nginx-node.conf.template "dist/${DIST}/deploy/"

          # Self-contained installer (downloads release package or uses local bundle, generates systemd units)
          install -m 755 install.sh "dist/${DIST}/install.sh"
          cp deploy/systemd/RELEASE_README.md "dist/${DIST}/README.md"

          tar -czf "dist/aurora-waf-${VERSION}-linux-amd64.tar.gz" -C dist "${DIST}"
          (cd dist && sha256sum "aurora-waf-${VERSION}-linux-amd64.tar.gz" > "aurora-waf-${VERSION}-linux-amd64.tar.gz.sha256")

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/aurora-waf-*.tar.gz*
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Push Docker images to GHCR.
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Images → GHCR
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: controller
            dockerfile: deploy/docker/Dockerfile.controller
          - image: node
            dockerfile: deploy/docker/Dockerfile.node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcre2-dev

      - name: Build all required artifacts
        run: |
          # Rust compiler
          cargo build --locked --release -p aurora-engine --bin aurora-compile

          # NGINX module
          make module

          # NGINX runtime (for node image)
          cd build/nginx-source/nginx-1.30.4
          make -j$(nproc)
          make DESTDIR="$GITHUB_WORKSPACE/build/nginx-runtime" install
          mkdir -p "$GITHUB_WORKSPACE/build/nginx-runtime/usr/sbin"
          cp -f "$GITHUB_WORKSPACE/build/nginx-runtime/usr/local/nginx/sbin/nginx" "$GITHUB_WORKSPACE/build/nginx-runtime/usr/sbin/nginx"
          cd "$GITHUB_WORKSPACE"

          # UI + Controller binary
          cd ui && npm ci && npm run build && cd ..
          cd control-plane && CGO_ENABLED=0 go build -buildvcs=false -trimpath \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o ../build/aurora-controller ./cmd && cd ..

          # Brotli package (only needed for node image)
          if [ "${{ matrix.image }}" = "node" ] && [ -f deploy/docker/Dockerfile.brotli ]; then
            bash scripts/build-brotli-module.sh
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ── Trivy vulnerability scan ─────────────────────────────────────────
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release with the Linux tarball.
  # ─────────────────────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/aurora-waf-*.tar.gz
            dist/aurora-waf-*.tar.gz.sha256
          body: |
            ## Docker Images (GHCR)

            ```bash
            # Control Plane
            docker pull ghcr.io/${{ github.repository_owner }}/aurora-waf-controller:${{ github.ref_name }}

            # WAF Node (NGINX + Module)
            docker pull ghcr.io/${{ github.repository_owner }}/aurora-waf-node:${{ github.ref_name }}
            ```

            ## Linux Systemd (Bare-metal)
            
            ```bash
            # One-line quick installer (installs latest release)
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
            
            # Or install this specific release
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash -s -- -v ${{ github.ref_name }}
            
            # Or install from downloaded tarball
            tar xzf aurora-waf-*-linux-amd64.tar.gz
            cd aurora-waf-*-linux-amd64
            sudo ./install.sh
            ```
            
            See the included `README.md` in the tarball for full instructions.
