syntax = "proto3";

package aurora.sync.v1;

option go_package = "aurora-waf.local/control-plane/internal/transport/grpc/pb;pb";

service UpstreamSyncService {
  rpc GetUpstreams (GetUpstreamsRequest) returns (UpstreamSyncResponse);
  rpc ReportUpstreams (ReportUpstreamsRequest) returns (ReportUpstreamsResponse);
}

message GetUpstreamsRequest {
  string node_id = 1;
}

message UpstreamSyncResponse {
  int64 release_id = 1;
  string digest = 2;
  string config_content = 3;
}

message ReportUpstreamsRequest {
  string node_id = 1;
  int64 release_id = 2;
  string phase = 3;
  string message = 4;
}

message ReportUpstreamsResponse {
  bool success = 1;
}
