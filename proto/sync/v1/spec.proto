syntax = "proto3";

package aurora.sync.v1;

option go_package = "github.com/phucle996/aurora-api-gateway/control-plane/internal/transport/grpc/pb;pb";

service SpecSyncService {
  rpc SyncSpec (SyncSpecRequest) returns (SyncSpecResponse);
  rpc ReportSpec (ReportSpecRequest) returns (ReportSpecResponse);
}

message SyncSpecRequest {
  string current_hash = 1;
}

message SyncSpecResponse {
  bool in_sync = 1;
  int64 release_id = 2;
  string hash = 3;
  string spec_json = 4;
}

message ReportSpecRequest {
  int64 release_id = 1;
  string hash = 2;
  string status = 3; // "in_sync", "out_of_sync"
  string message = 4;
}

message ReportSpecResponse {
  bool success = 1;
}
