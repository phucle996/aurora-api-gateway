<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680px" height="500px" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;"><defs><marker id="m-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" /></marker><marker id="m-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" /></marker><marker id="m-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" /></marker><marker id="m-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" /></marker><marker id="m-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" /></marker></defs><rect width="680" height="500" fill="#ffffff" /><rect x="15" y="15" width="650" height="470" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5" rx="12" /><text x="35" y="45" font-size="17" font-weight="bold" fill="#047857" text-anchor="start">HÌNH 1.1D: ĐỘT PHÁ CƠ CHẾ ZERO-COPY C-ABI FFI CỦA ĐỀ TÀI</text><text x="35" y="70" font-size="13" font-weight="normal" fill="#065f46" text-anchor="start">Ý 4: NGINX truyền con trỏ sang Rust ➔ Đọc chung 1 ô nhớ ➔ Nhanh như C, An toàn tuyệt đối</text><rect x="35" y="95" width="610" height="225" fill="#ffffff" stroke="#10b981" stroke-width="1.5" rx="8" /><text x="50" y="118" font-size="13" font-weight="bold" fill="#065f46" text-anchor="start">🖥️ TIẾN TRÌNH NGINX WORKER (In-Process C-ABI Integration)</text><rect x="50" y="135" width="200" height="65" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="6" /><text x="65" y="158" font-size="13" font-weight="bold" fill="#047857" text-anchor="start">🅲 NGINX C Module</text><text x="65" y="180" font-size="11" font-weight="normal" fill="#064e3b" text-anchor="start" font-family="monospace">ngx_buf_t (0x7FFF_E000)</text><rect x="270" y="140" width="130" height="55" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" rx="4" /><text x="335" y="160" font-size="12" font-weight="bold" fill="#854d0e" text-anchor="middle">⚡ CPU Reg</text><text x="335" y="180" font-size="10" font-weight="normal" fill="#713f12" text-anchor="middle" font-family="monospace">RDI=ptr, RSI=len</text><rect x="420" y="135" width="210" height="65" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="6" /><text x="435" y="158" font-size="13" font-weight="bold" fill="#047857" text-anchor="start">🦀 Rust Core Engine</text><text x="435" y="180" font-size="11" font-weight="normal" fill="#064e3b" text-anchor="start" font-family="monospace">Fat Pointer &amp;[u8] (0x7FFF_E000)</text><line x1="250" y1="165" x2="265" y2="165" stroke="#059669" stroke-width="2" marker-end="url(#m-green)" /><line x1="400" y1="165" x2="415" y2="165" stroke="#059669" stroke-width="2" marker-end="url(#m-green)" /><rect x="50" y="220" width="580" height="85" fill="#d1fae5" stroke="#047857" stroke-width="2" rx="6" /><text x="65" y="242" font-size="12" font-weight="bold" fill="#065f46" text-anchor="start">💾 DUY NHẤT 1 Ô NHỚ TRONG RAM (Địa chỉ: 0x7FFF_E000 - 1024 bytes)</text><text x="65" y="268" font-size="12" font-weight="normal" fill="#064e3b" text-anchor="start" font-family="monospace">[ 'G' | 'E' | 'T' | ' ' | '/' | 'a' | 'p' | 'i' | '/' | 'v' | '1' | ... Payload ... ]</text><text x="65" y="290" font-size="11" font-weight="bold" fill="#047857" text-anchor="start">✨ 0 Byte Copy • 0 Byte Alloc • C và Rust cùng nhìn vào đúng ô nhớ này!</text><line x1="150" y1="200" x2="120" y2="220" stroke="#0284c7" stroke-width="2" marker-end="url(#m-blue)" /><line x1="520" y1="200" x2="230" y2="220" stroke="#059669" stroke-width="2" marker-end="url(#m-green)" /><rect x="35" y="335" width="610" height="135" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" rx="8" /><text x="55" y="360" font-size="14" font-weight="bold" fill="#047857" text-anchor="start">🚀 LỢI THẾ ĐỘT PHÁ CỦA KIẾN TRÚC ĐỀ TÀI:</text><text x="55" y="385" font-size="12" font-weight="normal" fill="#065f46" text-anchor="start">• Tốc độ cực hạn: Chi phí ranh giới O(1), chỉ tốn vài nanosecond truyền thanh ghi CPU.</text><text x="55" y="407" font-size="12" font-weight="normal" fill="#065f46" text-anchor="start">• Không tốn thêm RAM: Dữ liệu nằm nguyên vị trí trong bộ đệm của NGINX.</text><text x="55" y="429" font-size="12" font-weight="normal" fill="#065f46" text-anchor="start">• An toàn bộ nhớ tuyệt đối: Trình biên dịch Rust bảo đảm mượn an toàn, không có lỗi con trỏ.</text><text x="55" y="451" font-size="12" font-weight="bold" fill="#047857" text-anchor="start">• Độ trễ đuôi P99 phẳng lỳ: 0ms Pause Time, không GC, không phân mảnh vùng nhớ.</text></svg>