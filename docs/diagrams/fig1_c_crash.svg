<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680px" height="500px" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;"><defs><marker id="m-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" /></marker><marker id="m-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" /></marker><marker id="m-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" /></marker><marker id="m-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" /></marker><marker id="m-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" /></marker></defs><rect width="680" height="500" fill="#ffffff" /><rect x="15" y="15" width="650" height="470" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="12" /><text x="35" y="45" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="start">HÌNH 1.1A: RỦI RO SẬP TIẾN TRÌNH CỦA C/C++ THUẦN</text><text x="35" y="70" font-size="13" font-weight="normal" fill="#991b1b" text-anchor="start">Ý 1: C rất nhanh nhưng quản lý bộ nhớ thủ công ➔ Lỗi con trỏ làm sập Gateway</text><rect x="35" y="100" width="260" height="110" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" rx="6" /><text x="50" y="125" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="start">⚠️ Malformed HTTP Request</text><text x="50" y="150" font-size="12" font-weight="normal" fill="#450a0a" text-anchor="start">• Header dị dạng / Payload quá lớn</text><text x="50" y="172" font-size="12" font-weight="normal" fill="#450a0a" text-anchor="start">• Cố tình khai thác Buffer Overflow</text><text x="50" y="194" font-size="12" font-weight="normal" fill="#450a0a" text-anchor="start">• Chuỗi không kết thúc bằng \0</text><rect x="375" y="100" width="270" height="110" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" rx="6" /><text x="390" y="125" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="start">🅲 NGINX C Module</text><text x="390" y="150" font-size="12" font-weight="normal" fill="#7f1d1d" text-anchor="start" font-family="monospace">• Đọc chuỗi: strcpy() / memcpy()</text><text x="390" y="172" font-size="12" font-weight="normal" fill="#7f1d1d" text-anchor="start" font-family="monospace">• Tràn bộ đệm (Out of Bounds)</text><text x="390" y="194" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="start">• Ghi đè lên vùng nhớ cấm!</text><line x1="295" y1="155" x2="365" y2="155" stroke="#dc2626" stroke-width="2.5" marker-end="url(#m-red)" /><text x="335" y="145" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Payload</text><rect x="35" y="230" width="610" height="110" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="8" /><text x="55" y="260" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="start">💥 SỰ CỐ: SEGMENTATION FAULT (SIGSEGV)</text><text x="55" y="288" font-size="13" font-weight="normal" fill="#991b1b" text-anchor="start">Linux Kernel phát hiện tiến trình đọc/ghi vùng nhớ cấm ➔ HẠ GỤC TIẾN TRÌNH!</text><text x="55" y="318" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="start">☠️ NGINX Worker Process (PID 1042) CRASH &amp; DIED NGAY LẬP TỨC!</text><rect x="35" y="360" width="610" height="110" fill="#450a0a" stroke="#7f1d1d" stroke-width="1.5" rx="8" /><text x="55" y="390" font-size="15" font-weight="bold" fill="#fca5a5" text-anchor="start">🚨 HẬU QUẢ: HÀNG NGÀN CLIENTS BỊ ĐỨT KẾT NỐI</text><text x="55" y="418" font-size="12" font-weight="normal" fill="#fecaca" text-anchor="start">• 10.000 kết nối TCP đang mở trên Worker này bị hủy hoại đồng loạt.</text><text x="55" y="440" font-size="12" font-weight="normal" fill="#fecaca" text-anchor="start">• Client nhận lỗi: 502 Bad Gateway hoặc Connection Reset By Peer.</text></svg>