<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680px" height="500px" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;"><defs><marker id="m-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" /></marker><marker id="m-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" /></marker><marker id="m-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" /></marker><marker id="m-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" /></marker><marker id="m-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" /></marker></defs><rect width="680" height="500" fill="#ffffff" /><rect x="15" y="15" width="650" height="470" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" rx="12" /><text x="35" y="45" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="start">HÌNH 1.1C: CHI PHÍ SAO CHÉP QUA RANH GIỚI MÁY ẢO SANDBOX</text><text x="35" y="70" font-size="13" font-weight="normal" fill="#5b21b6" text-anchor="start">Ý 3: WebAssembly/VM an toàn nhưng phải memcpy dữ liệu qua lại giữa Host &amp; VM</text><rect x="35" y="95" width="610" height="220" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" rx="8" /><text x="50" y="120" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="start">🖥️ TIẾN TRÌNH NGINX / ENVOY WORKER</text><rect x="50" y="140" width="220" height="120" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="6" /><text x="65" y="165" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="start">🅲 Host Memory (C)</text><text x="65" y="190" font-size="12" font-weight="normal" fill="#4c1d95" text-anchor="start" font-family="monospace">ngx_buf_t (0x2000)</text><text x="65" y="215" font-size="12" font-weight="normal" fill="#4c1d95" text-anchor="start" font-family="monospace">[ Payload: 500 KB ]</text><text x="65" y="240" font-size="11" font-weight="normal" fill="#6d28d9" text-anchor="start">(Bản gốc của Proxy)</text><rect x="290" y="140" width="55" height="120" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" rx="4" /><text x="317" y="175" font-size="16" font-weight="normal" fill="#1e293b" text-anchor="middle">🧱</text><text x="317" y="200" font-size="10" font-weight="bold" fill="#7e22ce" text-anchor="middle">Ranh giới</text><text x="317" y="218" font-size="10" font-weight="bold" fill="#7e22ce" text-anchor="middle">VM Wasm</text><rect x="365" y="140" width="260" height="120" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="6" /><text x="380" y="165" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="start">📦 Wasm Linear Memory</text><text x="380" y="190" font-size="12" font-weight="normal" fill="#4c1d95" text-anchor="start" font-family="monospace">VM Heap (0x6000)</text><text x="380" y="215" font-size="12" font-weight="normal" fill="#dc2626" text-anchor="start" font-family="monospace">[ Bản sao: 500 KB ]</text><text x="380" y="240" font-size="11" font-weight="normal" fill="#dc2626" text-anchor="start">(Phải copy vào máy ảo để đọc!)</text><line x1="160" y1="285" x2="480" y2="285" stroke="#7c3aed" stroke-width="3" marker-end="url(#m-purple)" /><text x="320" y="275" font-size="12" font-weight="bold" fill="#6d28d9" text-anchor="middle">🔄 malloc() + memcpy(500.000 Bytes)</text><rect x="35" y="335" width="610" height="135" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" rx="8" /><text x="55" y="360" font-size="14" font-weight="bold" fill="#6d28d9" text-anchor="start">♨️ SỰ LÃNG PHÍ TÀI NGUYÊN KHI DÙNG MÁY ẢO SANDBOX:</text><text x="55" y="385" font-size="12" font-weight="normal" fill="#4c1d95" text-anchor="start">• Chi phí sao chép tỷ lệ thuận với kích thước gói tin: O(N) Memory Copy.</text><text x="55" y="407" font-size="12" font-weight="normal" fill="#4c1d95" text-anchor="start">• Nhân đôi tiêu thụ RAM: 1 gói tin 500 KB ngốn 1 MB RAM để phân tích an ninh.</text><text x="55" y="429" font-size="12" font-weight="normal" fill="#4c1d95" text-anchor="start">• CPU bị chiếm dụng chỉ để di chuyển byte giữa Host và VM Sandbox.</text><text x="55" y="451" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="start">• Kéo tụt thông lượng (Throughput) nghiêm trọng khi hệ thống nhận tải lớn.</text></svg>