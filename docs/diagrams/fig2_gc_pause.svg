<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680px" height="500px" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;"><defs><marker id="m-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" /></marker><marker id="m-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" /></marker><marker id="m-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" /></marker><marker id="m-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" /></marker><marker id="m-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" /></marker></defs><rect width="680" height="500" fill="#ffffff" /><rect x="15" y="15" width="650" height="470" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" rx="12" /><text x="35" y="45" font-size="17" font-weight="bold" fill="#b45309" text-anchor="start">HÌNH 1.1B: HẠN CHẾ CỦA BỘ THU GOM RÁC (GC PAUSE)</text><text x="35" y="70" font-size="13" font-weight="normal" fill="#92400e" text-anchor="start">Ý 2: Ngôn ngữ an toàn (Lua/Go) tránh lỗi con trỏ nhưng bị dừng tiến trình để dọn RAM</text><text x="35" y="105" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">⏱️ Dòng thời gian tại tải cao (50.000 req/s):</text><rect x="35" y="118" width="160" height="45" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" rx="4" /><text x="115" y="146" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">✅ Xử lý (0.5ms)</text><rect x="205" y="115" width="270" height="50" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="6" /><text x="340" y="137" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">🛑 STOP-THE-WORLD (10ms)</text><text x="340" y="155" font-size="11" font-weight="normal" fill="#b91c1c" text-anchor="middle">⏸️ Đóng băng Worker để quét RAM</text><rect x="485" y="118" width="160" height="45" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" rx="4" /><text x="565" y="146" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">▶️ Xử lý tiếp</text><rect x="35" y="185" width="610" height="125" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" rx="8" /><text x="50" y="210" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">🚗🚚 Hàng đợi Socket nghẽn cứng trong 10 mili-giây dừng lại:</text><rect x="50" y="225" width="105" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="3" /><text x="60" y="245" font-size="11" font-weight="bold" fill="#92400e" text-anchor="start" font-family="monospace">Req #101</text><rect x="165" y="225" width="105" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="3" /><text x="175" y="245" font-size="11" font-weight="bold" fill="#92400e" text-anchor="start" font-family="monospace">Req #102</text><rect x="280" y="225" width="105" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="3" /><text x="290" y="245" font-size="11" font-weight="bold" fill="#92400e" text-anchor="start" font-family="monospace">Req #103</text><rect x="395" y="225" width="105" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="3" /><text x="405" y="245" font-size="11" font-weight="bold" fill="#92400e" text-anchor="start" font-family="monospace">Req #104</text><rect x="510" y="225" width="105" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="3" /><text x="520" y="245" font-size="11" font-weight="bold" fill="#92400e" text-anchor="start" font-family="monospace">+500 reqs kẹt cứng!</text><text x="50" y="280" font-size="11" font-weight="bold" fill="#b45309" text-anchor="start">⚠️ Với 50.000 req/s: Dừng 10ms = 500 yêu cầu bị kẹt cứng trong Socket Backlog!</text><text x="50" y="298" font-size="11" font-weight="normal" fill="#78350f" text-anchor="start">• CPU 100% bận quét con trỏ dọn RAM ➔ Lãng phí chu kỳ mạng vô ích.</text><rect x="35" y="330" width="610" height="140" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" rx="8" /><text x="50" y="352" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">📈 Độ trễ gián đoạn (Jitter) – P99 Tail Latency bùng nổ:</text><rect x="60" y="440" width="560" height="2" fill="#94a3b8" stroke="none" stroke-width="1.5" rx="8" /><text x="60" y="455" font-size="10" font-weight="normal" fill="#64748b" text-anchor="start">0ms</text><text x="60" y="385" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="start">40ms</text><rect x="90" y="428" width="18" height="12" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="118" y="426" width="18" height="14" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="146" y="429" width="18" height="11" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="174" y="425" width="18" height="15" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="202" y="427" width="18" height="13" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="245" y="370" width="40" height="70" fill="#ef4444" stroke="#b91c1c" stroke-width="2" rx="2" /><text x="248" y="360" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="start">💥 35ms</text><rect x="300" y="415" width="18" height="25" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="328" y="422" width="18" height="18" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="356" y="426" width="18" height="14" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="384" y="427" width="18" height="13" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="412" y="426" width="18" height="14" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><text x="380" y="415" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="start">P99 Spike: Độ trễ bị vọt đỉnh bất thường!</text></svg>