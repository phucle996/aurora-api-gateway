<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 950" width="1320px" height="950px" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;"><rect width="1320" height="950" fill="#ffffff" /><text x="660" y="45" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">🛑 TÁC HẠI CỦA KHOẢNG DỪNG THU GOM RÁC (GC PAUSE) TRONG HỆ THỐNG HIỆU NĂNG CAO</text><text x="660" y="72" text-anchor="middle" font-size="14" fill="#64748b">Tại sao vài phần nghìn giây (milliseconds) dừng lại dọn rác là sự lãng phí nghiêm trọng ở quy mô tải lớn</text><rect x="50" y="95" width="1220" height="395" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="12" /><text x="80" y="125" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="start">❌  HỆ THỐNG CÓ BỘ THU GOM RÁC GC (Ví dụ: LuaJIT trong Kong/APISIX, hoặc Go Gateway)</text><text x="80" y="147" font-size="13" font-weight="normal" fill="#7f1d1d" text-anchor="start">Cơ chế: Chương trình chạy bình thường ➔ RAM đầy ➔ Stop-The-World (Dừng toàn bộ tiến trình) để quét và dọn rác</text><text x="80" y="177" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="start">⏱️ Dòng thời gian xử lý gói tin (Tại mức tải 50.000 req/s):</text><rect x="80" y="190" width="260" height="45" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" rx="4" /><text x="210" y="218" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">✅ Đang xử lý mượt mà (0.5 ms)</text><rect x="350" y="185" width="350" height="55" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" rx="6" /><text x="525" y="210" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">🛑 STOP-THE-WORLD GC PAUSE (5ms - 15ms)</text><text x="525" y="230" font-size="11" font-weight="normal" fill="#b91c1c" text-anchor="middle">⏸️ Toàn bộ Worker bị ĐÓNG BĂNG để quét RAM!</text><rect x="710" y="190" width="230" height="45" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" rx="4" /><text x="825" y="218" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">▶️ Xử lý bù sau khi dọn rác xong</text><rect x="80" y="255" width="580" height="210" fill="#ffffff" stroke="#f87171" stroke-width="1.5" rx="8" /><text x="100" y="280" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="start">🚗🚚 Hậu quả tại thời điểm GC dừng 10 mili-giây:</text><rect x="100" y="300" width="540" height="65" fill="#fff1f2" stroke="#e11d48" stroke-width="1" rx="4" /><text x="115" y="320" font-size="12" font-weight="bold" fill="#9f1239" text-anchor="start">Kernel Backlog / Socket Queue (Kẹt xe nghiêm trọng!):</text><rect x="115" y="330" width="80" height="26" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5" rx="3" /><text x="123" y="347" font-size="11" font-weight="bold" fill="#881337" text-anchor="start" font-family="monospace">Req #101</text><rect x="203" y="330" width="80" height="26" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5" rx="3" /><text x="211" y="347" font-size="11" font-weight="bold" fill="#881337" text-anchor="start" font-family="monospace">Req #102</text><rect x="291" y="330" width="80" height="26" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5" rx="3" /><text x="299" y="347" font-size="11" font-weight="bold" fill="#881337" text-anchor="start" font-family="monospace">Req #103</text><rect x="379" y="330" width="80" height="26" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5" rx="3" /><text x="387" y="347" font-size="11" font-weight="bold" fill="#881337" text-anchor="start" font-family="monospace">Req #104</text><rect x="467" y="330" width="80" height="26" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5" rx="3" /><text x="475" y="347" font-size="11" font-weight="bold" fill="#881337" text-anchor="start" font-family="monospace">Req #105</text><rect x="555" y="330" width="80" height="26" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5" rx="3" /><text x="563" y="347" font-size="11" font-weight="bold" fill="#881337" text-anchor="start" font-family="monospace">... +500 reqs</text><text x="100" y="390" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="start">⚠️ Tại tốc độ 50.000 req/s, chỉ cần đứng lại 10 ms ➔ Có 500 yêu cầu bị kẹt cứng!</text><text x="100" y="415" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">• 500 yêu cầu này bị đội độ trễ lên gấp hàng chục lần (P99 tail latency vọt đỉnh).</text><text x="100" y="437" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">• CPU bận rộn quét cây con trỏ dọn RAM vô ích thay vì phục vụ người dùng mạng.</text><rect x="680" y="255" width="380" height="210" fill="#ffffff" stroke="#f87171" stroke-width="1.5" rx="8" /><text x="700" y="280" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="start">📈 Biểu đồ độ trễ (Latency Jitter):</text><rect x="710" y="405" width="320" height="2" fill="#94a3b8" stroke="none" stroke-width="1.5" rx="8" /><text x="710" y="420" font-size="10" font-weight="normal" fill="#64748b" text-anchor="start">0ms</text><text x="710" y="320" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="start">40ms (P99 Spike!)</text><rect x="740" y="390" width="14" height="15" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="758" y="393" width="14" height="12" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="776" y="389" width="14" height="16" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="794" y="391" width="14" height="14" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="822" y="325" width="32" height="80" fill="#ef4444" stroke="#b91c1c" stroke-width="2" rx="2" /><text x="824" y="315" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="start">💥 35ms</text><rect x="864" y="380" width="14" height="25" fill="#f59e0b" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="882" y="387" width="14" height="18" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="900" y="391" width="14" height="14" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><rect x="918" y="392" width="14" height="13" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" rx="1" /><text x="710" y="445" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="start">Độ trễ gián đoạn: Thỉnh thoảng vọt đỉnh bất thường (Jitter)</text><rect x="1080" y="185" width="170" height="280" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" rx="8" /><text x="1165" y="210" font-size="14" font-weight="bold" fill="#9f1239" text-anchor="middle">ĐÁNH GIÁ GC</text><text x="1095" y="240" font-size="11" font-weight="normal" fill="#881337" text-anchor="start">🗑️ Dọn rác chạy ngầm</text><text x="1095" y="266" font-size="11" font-weight="normal" fill="#881337" text-anchor="start">⏸️ Stop-The-World</text><text x="1095" y="292" font-size="11" font-weight="normal" fill="#881337" text-anchor="start">📈 Bùng nổ P99 Latency</text><text x="1095" y="318" font-size="11" font-weight="normal" fill="#881337" text-anchor="start">📉 Giảm thông lượng</text><text x="1095" y="344" font-size="11" font-weight="normal" fill="#881337" text-anchor="start">🚗 Kẹt hàng đợi socket</text><text x="1095" y="370" font-size="11" font-weight="normal" fill="#881337" text-anchor="start">⚡ Lãng phí chu kỳ CPU</text><text x="1095" y="396" font-size="11" font-weight="normal" fill="#881337" text-anchor="start">⚠️ Giật cục bất định</text><rect x="50" y="515" width="1220" height="390" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5" rx="12" /><text x="80" y="545" font-size="16" font-weight="bold" fill="#047857" text-anchor="start">✨  HỆ THỐNG AN TOÀN BỘ NHỚ KHÔNG CẦN GC (Ngôn ngữ Rust - Đề tài áp dụng)</text><text x="80" y="567" font-size="13" font-weight="normal" fill="#065f46" text-anchor="start">Cơ chế: Ownership &amp; RAII (Tự động giải phóng RAM ngay khi hết hàm, KHÔNG BAO GIỜ dừng tiến trình)</text><text x="80" y="597" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="start">⏱️ Dòng thời gian xử lý gói tin (Hoàn toàn phẳng và ổn định tuyệt đối):</text><rect x="80" y="610" width="860" height="45" fill="#d1fae5" stroke="#059669" stroke-width="2" rx="4" /><text x="510" y="638" font-size="13" font-weight="bold" fill="#064e3b" text-anchor="middle">🚀 LIÊN TỤC VÀ ĐỀU ĐẶN: Xử lý thông suốt 100% thời gian  •  KHÔNG CÓ KHOẢNG DỪNG STOP-THE-WORLD!</text><rect x="80" y="675" width="580" height="205" fill="#ffffff" stroke="#34d399" stroke-width="1.5" rx="8" /><text x="100" y="700" font-size="14" font-weight="bold" fill="#047857" text-anchor="start">⚡ Luồng gói tin chạy xuyên suốt không gián đoạn:</text><rect x="100" y="720" width="540" height="55" fill="#ecfdf5" stroke="#10b981" stroke-width="1" rx="4" /><rect x="115" y="730" width="80" height="32" fill="#a7f3d0" stroke="#059669" stroke-width="1.5" rx="3" /><text x="125" y="750" font-size="11" font-weight="bold" fill="#064e3b" text-anchor="start" font-family="monospace">Req #201</text><rect x="203" y="730" width="80" height="32" fill="#a7f3d0" stroke="#059669" stroke-width="1.5" rx="3" /><text x="213" y="750" font-size="11" font-weight="bold" fill="#064e3b" text-anchor="start" font-family="monospace">Req #202</text><rect x="291" y="730" width="80" height="32" fill="#a7f3d0" stroke="#059669" stroke-width="1.5" rx="3" /><text x="301" y="750" font-size="11" font-weight="bold" fill="#064e3b" text-anchor="start" font-family="monospace">Req #203</text><rect x="379" y="730" width="80" height="32" fill="#a7f3d0" stroke="#059669" stroke-width="1.5" rx="3" /><text x="389" y="750" font-size="11" font-weight="bold" fill="#064e3b" text-anchor="start" font-family="monospace">Req #204</text><rect x="467" y="730" width="80" height="32" fill="#a7f3d0" stroke="#059669" stroke-width="1.5" rx="3" /><text x="477" y="750" font-size="11" font-weight="bold" fill="#064e3b" text-anchor="start" font-family="monospace">Req #205</text><rect x="555" y="730" width="80" height="32" fill="#a7f3d0" stroke="#059669" stroke-width="1.5" rx="3" /><text x="565" y="750" font-size="11" font-weight="bold" fill="#064e3b" text-anchor="start" font-family="monospace">Req #206</text><text x="100" y="800" font-size="12" font-weight="bold" fill="#047857" text-anchor="start">🧹 Bộ nhớ được dọn dẹp tức thì (Deterministic Deallocation) ngay khi request xong.</text><text x="100" y="825" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">• Hàng đợi luôn rỗng, gói tin đi thẳng vào backend mà không bị trễ nhịp nào.</text><text x="100" y="847" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">• Tận dụng 100% chu kỳ CPU để phân tích gói tin, không phí 1ms dọn rác.</text><rect x="680" y="675" width="380" height="205" fill="#ffffff" stroke="#34d399" stroke-width="1.5" rx="8" /><text x="700" y="700" font-size="14" font-weight="bold" fill="#047857" text-anchor="start">📉 Biểu đồ độ trễ: Phẳng lỳ, ổn định vi mô (&lt; 1ms)</text><rect x="710" y="825" width="320" height="2" fill="#94a3b8" stroke="none" stroke-width="1.5" rx="8" /><text x="710" y="840" font-size="10" font-weight="normal" fill="#64748b" text-anchor="start">0ms</text><text x="710" y="760" font-size="11" font-weight="bold" fill="#059669" text-anchor="start">1ms (P99 Flat)</text><rect x="730" y="810" width="14" height="15" fill="#10b981" stroke="#047857" stroke-width="1.5" rx="1" /><rect x="753" y="810" width="14" height="15" fill="#10b981" stroke="#047857" stroke-width="1.5" rx="1" /><rect x="776" y="810" width="14" height="15" fill="#10b981" stroke="#047857" stroke-width="1.5" rx="1" /><rect x="799" y="810" width="14" height="15" fill="#10b981" stroke="#047857" stroke-width="1.5" rx="1" /><rect x="822" y="810" width="14" height="15" fill="#10b981" stroke="#047857" stroke-width="1.5" rx="1" /><rect x="845" y="810" width="14" height="15" fill="#10b981" stroke="#047857" stroke-width="1.5" rx="1" /><rect x="868" y="810" width="14" height="15" fill="#10b981" stroke="#047857" stroke-width="1.5" rx="1" /><rect x="891" y="810" width="14" height="15" fill="#10b981" stroke="#047857" stroke-width="1.5" rx="1" /><rect x="914" y="810" width="14" height="15" fill="#10b981" stroke="#047857" stroke-width="1.5" rx="1" /><rect x="937" y="810" width="14" height="15" fill="#10b981" stroke="#047857" stroke-width="1.5" rx="1" /><rect x="960" y="810" width="14" height="15" fill="#10b981" stroke="#047857" stroke-width="1.5" rx="1" /><rect x="983" y="810" width="14" height="15" fill="#10b981" stroke="#047857" stroke-width="1.5" rx="1" /><text x="710" y="865" font-size="11" font-weight="normal" fill="#064e3b" text-anchor="start">Độ trễ P99 cực kỳ ổn định, không có đỉnh nhọn (Zero-Jitter)</text><rect x="1080" y="605" width="170" height="275" fill="#ecfdf5" stroke="#10b981" stroke-width="2" rx="8" /><text x="1165" y="630" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">ĐÁNH GIÁ RUST</text><text x="1095" y="660" font-size="11" font-weight="normal" fill="#065f46" text-anchor="start">🚫 Không có GC</text><text x="1095" y="686" font-size="11" font-weight="normal" fill="#065f46" text-anchor="start">⚡ 0ms Pause Time</text><text x="1095" y="712" font-size="11" font-weight="normal" fill="#065f46" text-anchor="start">📉 P99 phẳng tuyệt đối</text><text x="1095" y="738" font-size="11" font-weight="normal" fill="#065f46" text-anchor="start">🏎️ Thông lượng tối đa</text><text x="1095" y="764" font-size="11" font-weight="normal" fill="#065f46" text-anchor="start">🔒 An toàn như Java/Go</text><text x="1095" y="790" font-size="11" font-weight="normal" fill="#065f46" text-anchor="start">🚀 Nhanh như C thuần</text><text x="1095" y="816" font-size="11" font-weight="normal" fill="#065f46" text-anchor="start">✨ Không lãng phí 1ms</text></svg>